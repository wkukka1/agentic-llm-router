[project]
name = "agentic-llm-router"
version = "0.1.0"
description = "Cost-aware LLM router research project (Foundation data pipeline + NIRT baseline)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "PyYAML",
  "scikit-learn",
  "scipy",
  "python-dotenv",
  "tqdm",
  "datasets",
  "sentence-transformers",
  "transformers",
  "torch",
  "matplotlib",
  "faiss-cpu",
  "umap-learn",
  "hdbscan",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
router-phase0 = "training.phase0:main"
prompt-decomposition = "prompt_decomposition.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "langchain-core>=0.3",
  "import-linter",
]
labeling = [
  "openai",
  "anthropic",
]
encoders = [
  "torch",
  "transformers",
  "huggingface_hub",
]
data = [
  "datasets",
  "huggingface_hub",
  "tqdm",
]
agentic = [
  "langchain>=0.3",
  "langchain-core>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length is handled by the formatter, not the linter
  "B008",  # argparse/dataclass defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.importlinter]
root_packages = ["router", "training", "evaluation", "decompose"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Serving never imports training or evaluation"
type = "forbidden"
source_modules = ["router"]
forbidden_modules = ["training", "evaluation"]

ignore_imports = [
  "router.routing.routers -> training.data.facade",
]

[[tool.importlinter.contracts]]
name = "Training never imports evaluation"
type = "forbidden"
source_modules = ["training"]
forbidden_modules = ["evaluation"]

[[tool.importlinter.contracts]]
name = "Decompose stays dependency-free"
type = "forbidden"
source_modules = ["decompose"]
forbidden_modules = ["router", "training", "evaluation"]

ignore_imports = [
  "decompose.embedders.bert -> router.embeddings.encoder",
  "decompose.embedders.sentence_transformer -> router.embeddings.encoder",
]