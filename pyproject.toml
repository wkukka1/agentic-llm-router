[project]
name = "agentic-llm-router"
version = "0.1.0"
description = "Prompt decomposition: domain and task classifiers for an LLM router"
requires-python = ">=3.11"

# The core is deliberately light: label spaces, splitting, the lexical models,
# serving and the audit need only these. Frozen sentence encoders pull in torch
# and transformers, which is most of a gigabyte, so they live in an extra --
# `pip install -e .[encoders]`. CI installs the core and runs offline.
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "PyYAML",
  "scikit-learn",
  "scipy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
prompt-decomposition = "prompt_decomposition.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
encoders = ["torch", "transformers", "huggingface_hub"]
data = ["datasets", "huggingface_hub", "tqdm"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length is handled by the formatter, not the linter
  "B008",  # argparse/dataclass defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately, and re-import inside test bodies.
"tests/*" = ["E402"]
