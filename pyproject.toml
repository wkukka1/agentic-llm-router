[project]
name = "agentic-llm-router"
version = "0.1.0"
description = "Domain/difficulty aware router over a pool of LLMs"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length is handled by the formatter, not the linter
  "B008",  # argparse/dataclass defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately, and re-import inside test bodies.
"tests/*" = ["E402"]
