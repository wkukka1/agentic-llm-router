[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-llm-router"
version = "0.1.0"
description = "Cost-aware LLM router research project (Foundation data pipeline + NIRT baseline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "pydantic>=2",                 # router.agentic.schemas: prompt / agent settings
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "langchain-core>=0.3", "import-linter", "httpx"]  # httpx: fastapi.testclient.TestClient
labeling = ["openai", "anthropic"]
# router.llm.adapters.anthropic: serve routed calls through Claude (AnthropicAdapter,
# ClientRegistry.anthropic + configs/serve_anthropic.yaml).
anthropic = ["anthropic>=1.0", "pyyaml"]
# router.agentic: LLM-driven orchestrator. Core install (echo backends,
# HeuristicTriage, a single-shot request) needs none of this; an orchestrated
# request's decompose/judge/synthesize calls through plan.model, which needs
# LangChain -- langchain-ollama specifically for a local Ollama plan.model.
agentic = ["langchain>=0.3", "langchain-core>=0.3", "langchain-ollama"]
# router.llm.adapters.ollama: serve routed calls through a local `ollama serve`
# (OllamaAdapter, ClientRegistry.ollama). No API key, no LangChain.
ollama = ["ollama>=0.4"]
# router.gateway: HTTP front door (Anthropic/OpenAI wire protocols) over the
# agentic ClientRegistry. Core install needs none of this -- deliberately
# kept free of `research` below so `pip install -e ".[gateway]"` stays a
# seconds-long, no-native-build install for someone who only wants to run
# the gateway locally (see docs/gateway.md).
gateway = ["fastapi", "uvicorn[standard]", "httpx", "fastembed", "huggingface_hub"]  # httpx: upstream client; fastembed: the router's text encoder without PyTorch; huggingface_hub: opt-in usage sharing (fastembed needs it anyway)
# The data pipeline + model training/eval stack (training/, evaluation/,
# most of decompose/): heavy, sometimes-native-build dependencies that
# nothing in router.agentic/router.llm/router.gateway actually imports
# (verified: importing router.gateway pulls in numpy/pandas/pyarrow, never
# these). Split out so those three stay installable without them.
research = [
    "datasets",
    "scikit-learn",
    "sentence-transformers",
    "transformers",
    "torch",
    "matplotlib",
    "scipy",
    # query ability taxonomy (clustering) + FAISS query bank -- used by
    # training.taxonomy / training.retrieval / Phase 1 relevance + warm-up.
    "faiss-cpu",
    "umap-learn",
    "hdbscan",
    # prompt decomposition: label sources, serving heads, report rendering
    "huggingface_hub",
    "tabulate",
]

[project.scripts]
router-phase0 = "training.phase0:main"
prompt-decomposition = "scripts.prompt_decomposition_cli:main"
aar-gateway = "router.gateway.cli:main"
aar-gateway-grade = "evaluation.gateway.grade:main"
aar-gateway-subagents = "evaluation.gateway.subagent_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"router.gateway" = ["static/*.html", "routers/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "real_data: reads the built data/ tables (10-25s each, skips when absent); deselect with -m 'not real_data'",
    "claude_e2e: drives a real logged-in Claude Code through an isolated gateway; runs only with AAR_E2E=1 (uses the plan)",
]

[tool.importlinter]
root_packages = ["router", "training", "evaluation", "decompose"]
# TYPE_CHECKING-only imports (e.g. router/data/nirt.py's `TrainingData` type hint)
# are zero-runtime-cost and not the kind of layering violation this enforces.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Serving never imports training or evaluation"
type = "forbidden"
source_modules = ["router"]
forbidden_modules = ["training", "evaluation"]
# NIRTRouter / KNNRouter / MLPRouter read pre-built embedding stores and a
# train-split cost table off TrainingData, the same way NIRTRouter.from_run
# reads a pre-built model checkpoint -- see the NOTE in router/routing/routers.py.
# A serving-safe "artifact reader" split out of TrainingData would be new
# abstraction; tracked here instead. (router/data/nirt.py no longer needs an
# exception: NIRTDataset.from_config now requires `data` passed in and never
# resolves it or builds the observation table itself -- that convenience is
# training.data.nirt.nirt_dataset_from_config's job.)
#
# router.routing.model_profiles is the one serving-side bridge into the
# model-profile schema (configs/model_profiles.yaml) and its kNN-impute
# machinery -- NIRTRouter.resolve_pool_profile_matrix uses it to score a model
# outside the trained checkpoint's pool (an ad hoc profile rendered/embedded
# on the fly, optionally kNN-blended toward the trained pool) without a new
# checkpoint. All training-side calls are function-local imports, confined to
# this one file, so the crossing is explicit and easy to audit.
ignore_imports = [
    "router.routing.routers -> training.data.facade",
    "router.routing.model_profiles -> training.models.profiles",
    "router.routing.model_profiles -> training.retrieval.model_bank",
]

[[tool.importlinter.contracts]]
name = "Training never imports evaluation"
type = "forbidden"
source_modules = ["training"]
forbidden_modules = ["evaluation"]

[[tool.importlinter.contracts]]
name = "Decompose stays dependency-free"
type = "forbidden"
source_modules = ["decompose"]
forbidden_modules = ["router", "training", "evaluation"]
# PromptEmbedder / SentenceEmbedder wrap the project's real, working encoder
# (router.embeddings.encoder.TextEncoder) rather than reimplementing
# tokenize/pool/normalize a second time -- see decompose/embedders/bert.py's
# docstring for the tradeoff.
ignore_imports = [
    "decompose.embedders.bert -> router.embeddings.encoder",
    "decompose.embedders.sentence_transformer -> router.embeddings.encoder",
]

[[tool.importlinter.contracts]]
name = "Prompt-decomposition heads stay dependency-free like the rest of decompose"
type = "forbidden"
source_modules = ["decompose.classifiers"]
forbidden_modules = ["router", "training", "evaluation"]
# The trained heads take vectors from an `Embedder` rather than importing an
# encoder, so unlike `decompose.embedders` they need no exception here.

# Ruff config for the prompt-decomposition subsystem. Scoped with `src` and
# `files` rather than applied repo-wide: the rest of the tree predates it and
# imposing a new lint gate on someone else's code is not this subsystem's call.
[tool.ruff]
line-length = 110
target-version = "py311"
include = [
  "src/decompose/classifiers/**/*.py",
  "src/training/prompt_decomposition/**/*.py",
  "src/evaluation/prompt_decomposition/**/*.py",
  "scripts/prompt_decomposition_cli.py",
  "tests/prompt_decomposition/**/*.py",
  "src/router/gateway/**/*.py",
  "src/evaluation/gateway/**/*.py",
  "src/router/llm/**/*.py",
  "tests/router/gateway/**/*.py",
  "src/ingest/**/*.py",
  "tests/ingest/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length is handled by the formatter, not the linter
  "B008",  # argparse/dataclass defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately, and re-import inside test bodies.
"tests/*" = ["E402"]
