# LLM profiles (human-editable).
#
# `feature` is a short natural-language description of the model -- the same
# style as GraphRouter / IRT-Router "llm descriptions". It is embedded by the
# `irt` encoder pathway (BERT) to give each model a text vector, which Phase 1
# uses to initialise the latent ability vector theta_m (crucial for cold-start
# models that have no response data).
#
# Optional structured fields (params_b, context_window, release, modality,
# input_price_per_1k, output_price_per_1k) are woven into the profile text and
# kept in `model_profiles.parquet` for reference. `null` = unknown.
#
# Keys are canonical model_ids (see configs/model_registry.yaml). Models not
# listed here fall back to a template built from the registry
# (provider / family / version) plus the empirical addendum.

version: 1

defaults:
  modality: [text]

# -- public-benchmark fields (see src/training/data/public_benchmarks.py +
# training.models.profiles.resolve_benchmarks for the full five-tier
# precedence) --
#   arena_name:         -> Chatbot Arena Elo, pinned to the 2023-12-15 snapshot
#                          (lmarena-ai/chatbot-arena-leaderboard HF Space).
#                          NOT the model's own canonical_id -- the leaderboard's
#                          own Model-column string (verified by directly
#                          fetching leaderboard_table_20231215.csv).
#   hf_repo_id:         -> HF Open LLM Leaderboard (open-weight models only).
#   benchlm_slug:       -> BenchLM.ai (verified via its own /models directory;
#                          its slugs do not follow our canonical_id convention).
#   openlm_scores: / model_card_scores: / benchmark_scores: -> hand-transcribed
#     (OpenLM.ai has no API/export; model cards are definitionally hand-read).

profiles:
  # ---- RouterBench candidates (have dense correctness data) ----
  gpt-4-1106-preview:
    feature: >-
      GPT-4 Turbo (November 2023 preview) is OpenAI's proprietary large
      multimodal model, a strong general reasoner with broad world knowledge and
      reliable instruction following. Among the strongest models in this pool on
      math, coding and multiple-choice knowledge tasks.
    params_b: null
    context_window: 128000
    release: "2023-11"
    input_price_per_1k: 0.01
    output_price_per_1k: 0.03
    # Arena row for this checkpoint is labelled "GPT-4-Turbo", not
    # "gpt-4-1106-preview" -- verified by fetching the CSV directly.
    arena_name: "GPT-4-Turbo"
    strengths:
      - "Strong general reasoning and broad world knowledge for its era"
      - "Reliable instruction following relative to GPT-3.5-class models"
    weaknesses:
      - "Superseded on most benchmarks by later 2024+ frontier releases"

  gpt-3.5-turbo-1106:
    feature: >-
      GPT-3.5 Turbo (November 2023) is OpenAI's fast, low-cost proprietary chat
      model. A capable generalist, clearly below GPT-4 on hard reasoning, math
      and code but competitive on everyday tasks at a fraction of the cost.
    params_b: null
    context_window: 16385
    release: "2023-11"
    input_price_per_1k: 0.001
    output_price_per_1k: 0.002

  claude-v1:
    feature: >-
      Claude v1 is an early Anthropic proprietary assistant model, tuned for
      helpfulness and safety, with solid language and knowledge ability and
      weaker mathematical reasoning.
    context_window: 100000
    release: "2023-03"

  claude-v2:
    feature: >-
      Claude 2 is Anthropic's proprietary assistant with a long context window,
      strong writing and comprehension, good multiple-choice knowledge accuracy
      and moderate math/coding skill.
    context_window: 100000
    release: "2023-07"

  claude-instant-v1:
    feature: >-
      Claude Instant v1 is Anthropic's fast, cheaper proprietary model. Lower
      latency and cost than Claude 2 with a modest drop in reasoning quality.
    context_window: 100000
    release: "2023-03"

  llama-2-70b-chat:
    feature: >-
      Llama 2 70B Chat is Meta's open-weight dense chat model (70B parameters,
      RLHF-tuned). A strong open generalist for its era, competent on knowledge
      and reasoning but noticeably weaker on math and code.
    params_b: 70
    context_window: 4096
    release: "2023-07"

  code-llama-34b-instruct:
    feature: >-
      Code Llama 34B Instruct is Meta's open-weight code-specialised model
      derived from Llama 2 (34B parameters). Tuned for program synthesis and
      infilling; general chat and knowledge performance is comparatively weak
      and it often mis-formats multiple-choice answers.
    params_b: 34
    context_window: 16384
    release: "2023-08"

  mixtral-8x7b-instruct:
    feature: >-
      Mixtral 8x7B Instruct is Mistral AI's open-weight sparse mixture-of-experts
      model (about 47B total / 13B active parameters). Fast for its quality, a
      strong open reasoner and mid-pack on math and code.
    params_b: 47
    context_window: 32768
    release: "2023-12"
    hf_repo_id: "mistralai/Mixtral-8x7B-Instruct-v0.1"
    arena_name: "Mixtral-8x7b-Instruct-v0.1"
    strengths:
      - "Strong reasoning-per-parameter via sparse MoE routing"
      - "Fast inference relative to dense 70B-class models"
    weaknesses:
      - "Weaker multi-step math than contemporary dense 70B models"

  mistral-7b-instruct:
    feature: >-
      Mistral 7B Instruct is Mistral AI's compact open-weight dense chat model
      (7B parameters). Efficient and a good small-model generalist; limited math
      and coding ability.
    params_b: 7
    context_window: 8192
    release: "2023-09"

  wizardlm-13b-v1.2:
    feature: >-
      WizardLM 13B v1.2 is an open-weight Llama-2-based model fine-tuned with
      Evol-Instruct data (13B parameters). Good instruction following, average
      reasoning, weak math.
    params_b: 13
    context_window: 4096
    release: "2023-08"

  yi-34b-chat:
    feature: >-
      Yi 34B Chat is 01.AI's open-weight bilingual (English/Chinese) dense chat
      model (34B parameters). Strong multiple-choice knowledge accuracy and
      solid Chinese-language performance.
    params_b: 34
    context_window: 4096
    release: "2023-11"

  # ---- GPT-4 Judge opponent already covered by mixtral-8x7b-instruct ----

  # ---- A few high-traffic Arena models (pairwise data only) ----
  gpt-4-0613:
    feature: >-
      GPT-4 (June 2023) is OpenAI's original proprietary GPT-4 release: a very
      strong reasoner with an 8K context window, predating the Turbo variants.
    context_window: 8192
    release: "2023-06"
  gpt-4-0314:
    feature: >-
      GPT-4 (March 2023) is the first public OpenAI GPT-4 checkpoint, a strong
      general reasoner with an 8K context window.
    context_window: 8192
    release: "2023-03"
  gpt-4-0125-preview:
    feature: >-
      GPT-4 Turbo (January 2024 preview) is an updated GPT-4 Turbo checkpoint
      addressing "laziness" in completions, with a 128K context window.
    context_window: 128000
    release: "2024-01"
  claude-2.1:
    feature: >-
      Claude 2.1 is Anthropic's proprietary assistant with a 200K context
      window and reduced hallucination versus Claude 2.0.
    context_window: 200000
    release: "2023-11"
  claude-2.0:
    feature: >-
      Claude 2.0 is Anthropic's proprietary long-context assistant, strong on
      writing and comprehension.
    context_window: 100000
    release: "2023-07"
    arena_name: "Claude-2.0"
    # MMLU value is the Arena leaderboard's OWN bundled MMLU column for this
    # row (leaderboard_table_20231215.csv) -- tagged with its real source,
    # not mislabelled as an independently-verified model-card figure.
    benchmark_scores:
      mmlu: {value: 78.5, unit: percent, source: lmarena_hf, snapshot_date: "2023-12-15"}
    strengths:
      - "Strong writing quality and long-document comprehension"
      - "200K-adjacent long context for its era (100K)"
    weaknesses:
      - "Weaker mathematical/multi-step reasoning than contemporary GPT-4-class models"
  gemini-pro:
    feature: >-
      Gemini Pro is Google's proprietary multimodal model, a capable generalist
      competitive with GPT-3.5-class systems on many tasks.
    release: "2023-12"
  mistral-medium:
    feature: >-
      Mistral Medium is Mistral AI's proprietary API model, positioned between
      Mixtral and frontier models in quality.
    release: "2023-12"
  tulu-2-dpo-70b:
    feature: >-
      Tulu 2 DPO 70B is AllenAI's open-weight Llama-2-70B fine-tune with DPO,
      a strong open instruction-following model.
    params_b: 70
    release: "2023-11"
  vicuna-33b:
    feature: >-
      Vicuna 33B is an open-weight Llama-based chat model fine-tuned on user
      conversations (33B parameters).
    params_b: 33
    release: "2023-08"

  vicuna-13b:
    feature: >-
      Vicuna 13B is an open-weight Llama-based chat model fine-tuned on
      user-shared ShareGPT conversations (13B parameters), from the same
      lmsys family as Vicuna 33B at a smaller scale.
    params_b: 13
    release: "2023-06"
    arena_name: "Vicuna-13B"
    strengths:
      - "Capable small-model generalist for its era, good at casual chat"
    weaknesses:
      - "Weak at math, code and multi-step reasoning relative to larger models"
      - "No instruction-tuning beyond ShareGPT-style conversational fine-tuning"

  # ---- Modern LLMRouterBench pool (configs/model_registry.yaml) ----
  # NOT yet loaded into responses.parquet and have ZERO pairwise battle data
  # in this repo -- these profiles are built for "profile coverage /
  # deployment readiness" only, never scored in any of E0-E6. BenchLM
  # "overall" scores below are directly fetched and confirmed; its
  # per-category sub-benchmark breakdown did NOT turn out to follow one
  # consistent flat {category: value} shape across every model page (some
  # categories list several named sub-benchmarks, not one number), so only
  # "overall" is relied on numerically here -- named sub-benchmarks are
  # folded into strengths/weaknesses as prose citations instead of invented
  # single numbers. hf_repo_id values below are standard HF repo-naming
  # conventions for these releases, NOT independently re-verified against
  # the live open-llm-leaderboard/contents dataset this session -- confirm
  # before trusting a specific number pulled through that path.
  claude-sonnet-4:
    feature: >-
      Claude Sonnet 4 is Anthropic's mid-tier proprietary model in the
      Claude 4 generation, balancing capability and cost for everyday
      agentic and coding workloads.
    context_window: 200000
    release: "2025-05"
    benchlm_slug: "claude-4-sonnet"   # benchlm.ai/models/claude-4-sonnet, overall 38.49
    strengths:
      - "Strong coding performance for its cost tier (SWE-bench Verified 72.7%, BenchLM)"
      - "Large 200K context window"
    weaknesses:
      - "Weaker on raw knowledge/hard-reasoning benchmarks than flagship Opus-tier models"

  deepseek-v3-0324:
    feature: >-
      DeepSeek-V3-0324 is DeepSeek's open-weight mixture-of-experts model
      (a March 2024 checkpoint update of DeepSeek-V3), competitive with
      proprietary frontier models on many benchmarks at open-weight cost.
    context_window: 128000
    release: "2024-03"
    hf_repo_id: "deepseek-ai/DeepSeek-V3-0324"
    benchlm_slug: "deepseek-v3-0324"   # exact slug match, overall 36.72
    strengths:
      - "Strong multilingual performance (MMLU-ProX 70.5%, BenchLM)"
      - "Open-weight, deployable at a fraction of proprietary frontier cost"
    weaknesses:
      - "Mixed knowledge-benchmark results (GPQA Diamond 65.5% vs. weaker Omniscience scores)"

  gemini-2.5-pro:
    feature: >-
      Gemini 2.5 Pro is Google's proprietary flagship multimodal model, with
      a 1M-token context window and strong coding and reasoning performance.
    context_window: 1000000
    release: "2025-03"
    benchlm_slug: "gemini-2-5-pro"   # overall 49.5
    strengths:
      - "Strong coding (SWE-bench Verified 63.8%, BenchLM) and reasoning (AA-LCR 69.0%)"
      - "1M-token context window; strong multimodal grounding (AA-MMMU-Pro 74.9%)"
    weaknesses:
      - "Weak on frontier math benchmarks (FrontierMath v2 Tiers 1-3: 14.1%, BenchLM)"

  gemini-2.5-flash:
    feature: >-
      Gemini 2.5 Flash is Google's proprietary fast/cheap multimodal model,
      the lower-latency sibling of Gemini 2.5 Pro.
    context_window: 1000000
    release: "2025-03"
    benchlm_slug: "gemini-2-5-flash"   # overall 42.32
    strengths:
      - "Fast, low-cost generalist with a 1M-token context window"
    weaknesses:
      - "Markedly weaker than Gemini 2.5 Pro on agentic tasks (tau2-bench 14.9% vs. 54.1%)"

  gpt-5:
    feature: >-
      GPT-5 is OpenAI's proprietary flagship model (medium reasoning
      effort), used in the LLMRouterBench performance-cost pool as
      "GPT-5-medium".
    release: "2025-08"
    # Proprietary -- confirmed absent from both BenchLM and the HF Open LLM
    # Leaderboard (neither will ever index a closed API model). No public
    # third-party aggregate number independently confirmed this session;
    # left without benchmark_scores rather than guess one.
    strengths:
      - "OpenAI's flagship-generation model at the time of its release"
    weaknesses: []

  gpt-5-chat:
    feature: >-
      GPT-5 Chat is OpenAI's proprietary chat-optimised GPT-5 variant.
    release: "2025-08"
    strengths: []
    weaknesses: []

  deepseek-v3.1-terminus:
    feature: >-
      DeepSeek-V3.1 Terminus is DeepSeek's open-weight updated V3.1
      checkpoint, refining instruction-following and reducing
      language-mixing issues from earlier V3.1 releases.
    release: "2025-09"
    hf_repo_id: "deepseek-ai/DeepSeek-V3.1-Terminus"
    strengths: []
    weaknesses: []

  deepseek-r1-0528:
    feature: >-
      DeepSeek-R1-0528 is DeepSeek's open-weight reasoning model (a May
      2025 checkpoint update of DeepSeek-R1), trained with large-scale
      reinforcement learning for chain-of-thought reasoning.
    release: "2025-05"
    hf_repo_id: "deepseek-ai/DeepSeek-R1-0528"
    strengths:
      - "Strong chain-of-thought reasoning from large-scale RL training"
    weaknesses: []

  qwen3-235b-a22b-2507:
    feature: >-
      Qwen3-235B-A22B-2507 is Alibaba's open-weight mixture-of-experts model
      (235B total / 22B active parameters), a July 2025 checkpoint update
      of Qwen3-235B-A22B.
    release: "2025-07"
    hf_repo_id: "Qwen/Qwen3-235B-A22B-Instruct-2507"
    strengths: []
    weaknesses: []

  qwen3-235b-a22b-thinking-2507:
    feature: >-
      Qwen3-235B-A22B-Thinking-2507 is the reasoning/"thinking"-mode variant
      of Qwen3-235B-A22B-2507.
    release: "2025-07"
    hf_repo_id: "Qwen/Qwen3-235B-A22B-Thinking-2507"
    strengths: []
    weaknesses: []

  glm-4.6:
    feature: >-
      GLM-4.6 is Zhipu AI's open-weight large language model, the latest in
      the GLM-4 series at the time of its release.
    release: "2025-09"
    hf_repo_id: "zai-org/GLM-4.6"
    strengths: []
    weaknesses: []

  kimi-k2-0905:
    feature: >-
      Kimi K2-0905 is Moonshot AI's open-weight mixture-of-experts model, a
      September 2025 checkpoint update of Kimi K2.
    release: "2025-09"
    hf_repo_id: "moonshotai/Kimi-K2-Instruct-0905"
    strengths: []
    weaknesses: []

  intern-s1:
    feature: >-
      Intern-S1 is Shanghai AI Laboratory's open-weight multimodal
      reasoning model from the InternLM family.
    release: "2025-07"
    hf_repo_id: "internlm/Intern-S1"
    strengths: []
    weaknesses: []
