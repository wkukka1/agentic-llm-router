    verified: false
    open_source: true
  wxai-llama-3-1-8b-instruct:
    input_per_1m: 0.60
    output_per_1m: 0.60
    source: "estimate from IBM Resource Unit tiers (Llama 3.1 8B); no current published rate"
    verified: false
    open_source: true
  wxai-llama-3-1-70b-instruct:
