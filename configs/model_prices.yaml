# Per-model USD token prices for models whose eval source does NOT carry a
# precomputed cost (lm-evaluation-harness, external benchmarks). RouterBench
# already ships a token-weighted `total_cost` per (model, query) and is NOT
# priced here.
#
# cost(model, query) = input_tokens * input_per_1m / 1e6
#                    + output_tokens * output_per_1m / 1e6
# (see training.data.pricing.fill_costs)
#
# A model with no entry here keeps cost = NaN and is dropped from the ROUTING
# eval (kept in the prediction eval) -- this is recorded in the phase battery.
#
# ------------------------------------------------------------------------------
# SNAPSHOT: 2026-09-01.  basis = "cheapest reputable serverless host" per the
# pool-expansion plan section 4.  These are APPROXIMATE public list prices and
# MUST be re-verified against the provider before any published number relies on
# them. The sub-2B models are rarely offered as managed endpoints -- their
# prices here are extrapolated from the smallest hosted tiers and are the
# roughest numbers in this file.
# ------------------------------------------------------------------------------

snapshot_date: "2026-09-01"
currency: USD
unit: per_1m_tokens
basis: "cheapest reputable serverless host; approximate public list price, verify before publication"

prices:
  # --- E3 small open-weight models (local GPU eval; priced as if served) -----
  # `open_source: true` on every entry here -- this file only prices open-weight
  # models (RouterBench's proprietary models carry their own precomputed cost
  # and are never priced here; see the module docstring above).
  phi-3.5-mini-instruct:
    input_per_1m: 0.03
    output_per_1m: 0.05
    source: "deepinfra/novita 2026-09 (microsoft/Phi-3.5-mini-instruct)"
    hf_repo: "microsoft/Phi-3.5-mini-instruct"
    open_source: true
  qwen2.5-3b-instruct:
    input_per_1m: 0.02
    output_per_1m: 0.04
    source: "novita 2026-09 (Qwen/Qwen2.5-3B-Instruct)"
    hf_repo: "Qwen/Qwen2.5-3B-Instruct"
    open_source: true
  qwen2.5-1.5b-instruct:
    input_per_1m: 0.015
    output_per_1m: 0.03
    source: "extrapolated from smallest hosted tier 2026-09 (Qwen/Qwen2.5-1.5B-Instruct)"
    hf_repo: "Qwen/Qwen2.5-1.5B-Instruct"
    open_source: true
  qwen2.5-0.5b-instruct:
    input_per_1m: 0.01
    output_per_1m: 0.02
    source: "extrapolated (rarely hosted) 2026-09 (Qwen/Qwen2.5-0.5B-Instruct)"
    hf_repo: "Qwen/Qwen2.5-0.5B-Instruct"
    open_source: true
  smollm2-1.7b-instruct:
    input_per_1m: 0.015
    output_per_1m: 0.03
    source: "extrapolated from smallest hosted tier 2026-09 (HuggingFaceTB/SmolLM2-1.7B-Instruct)"
    hf_repo: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
    open_source: true
  llama-3.1-8b-instruct:
    input_per_1m: 0.05
    output_per_1m: 0.08
    source: "deepinfra/novita 2026-09 (meta-llama/Llama-3.1-8B-Instruct)"
    hf_repo: "meta-llama/Llama-3.1-8B-Instruct"
    open_source: true

  # ---------------------------------------------------------------------------
  # SPROUT / CARROT pool (2024-25). UNVERIFIED -- see the warning below.
  #
  # These entries exist so the SPROUT pool can be used in cost-aware routing
  # analysis at all: the dataset ships per-call token counts but prices nothing,
  # and with no price table every SPROUT model is dropped from the routing eval.
  #
  # ****  THESE ARE RECALLED PUBLIC LIST PRICES, NOT CHECKED AGAINST A      ****
  # ****  PROVIDER PAGE. Unlike the block above, no one has verified them.  ****
  # ****  Treat any dollar figure derived from them as indicative only, and ****
  # ****  re-price before any number leaves the repo. The conclusions drawn ****
  # ****  from this pool are stated as price-robust (they survive a +/-50%  ****
  # ****  perturbation of every rate); the absolute costs are not.          ****
  #
  # watsonx (`wxai-*`) bills one blended token rate, so input and output are
  # set equal for those models rather than guessed apart.
  # ---------------------------------------------------------------------------
  openai-gpt-4o:
