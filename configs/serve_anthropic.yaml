# Serve every router pool model through Claude, for live AgenticRouter runs
# (scripts/agentic/latency_bench.py --anthropic, the opt-in smoke tests).
#
#   ClientRegistry.anthropic(yaml.safe_load(open("configs/serve_anthropic.yaml")), pool=router.model_ids)
#
# The router's pool (RouterBench / Arena / IRT-Router models) is mostly not
# Claude, and the Claude models in it are retired. Each pool id is mapped to a
# capability TIER and each tier to one current Claude model -- so a routing
# decision for a strong model is served by a strong Claude model, and so on.
# The tiers below are a rough, hand-made grouping by benchmark-era capability,
# not a fitted mapping: good enough to exercise real latency, cost and caching,
# NOT a basis for quality claims about the router's choices.
#
# Prices: USD per token, Anthropic first-party list prices (2026-06-24
# snapshot from the claude-api skill). Re-verify before relying on a number.

max_tokens: 1024        # per-call default; a call may pass its own

models:
  claude-opus-5:    {input_cost_per_token: 5.0e-6, output_cost_per_token: 25.0e-6}
  claude-sonnet-5:  {input_cost_per_token: 2.0e-6, output_cost_per_token: 10.0e-6}
  claude-haiku-4-5: {input_cost_per_token: 1.0e-6, output_cost_per_token: 5.0e-6}

tiers:
  strong: claude-opus-5
  mid: claude-sonnet-5
  small: claude-haiku-4-5

# pool ids not listed here are served at this tier
default_tier: mid

pool:
  # strong
  gpt-4-1106-preview: strong
  gpt_4o: strong
  llama31_405b_instruct: strong
  qwen25_72b_instruct: strong
  glm_4_plus: strong
  deepseek_chat: strong
  qwq_32b_preview: strong
  # mid
  claude-v1: mid
  claude-v2: mid
  gpt-3.5-turbo-1106: mid
  gpt_4o_mini_cot: mid
  llama31_70b_instruct: mid
  llama-2-70b-chat: mid
  mixtral-8x7b-instruct: mid
  yi-34b-chat: mid
  deepseek_coder: mid
  code-llama-34b-instruct: mid
  gemini15_flash: mid
  glm_4_air: mid
  qwen25_32b_int4: mid
  moonshot_v1_search: mid
  # small
  claude-instant-v1: small
  mistral-7b-instruct: small
  llama31_8b_instruct: small
  ministral_8b_instruct_2410: small
  qwen25_7b_instruct: small
  qwen25_math_7b_instruct: small
  glm_4_flash: small
  wizardlm-13b-v1.2: small
