# NIRT baseline configuration (Phase 2).
#
# Kept separate from configs/phase0.yaml: that file owns the DATA pipeline, this
# one owns the model. Data still reaches the trainer through the Phase 1 facade
# (training.data.facade.load_training_data), which reads configs/phase0.yaml itself.
#
# v1 scope: a deliberately simple IRT-structured predictor.
#   theta_q = f_theta(e_q)            e_q = frozen BERT query embedding (irt pathway)
#   y_hat   = sigmoid(a_m . theta_q - b_m)
# The profile embedding e_m INITIALISES / feeds the model side (a_m, b_m); it is
# not assumed to be the ability vector itself.

seed: 42

data:
  pathway: irt               # embedding pathway to join against (irt = BERT, 768-d)
  query_pathway: null        # override for the QUERY store only (profile stays on `pathway`).
                             #   null -> use `pathway`. Set to a kNN-imputed pathway
                             #   (e.g. knn10w) to feed the retrieval-smoothed e_q.
  # Structured per-query features (training.data.query_features), concatenated to
  # e_q. Built with scripts/embeddings/build_query_features.py. null -> unchanged
  # (no concat). Capacity-workstream finding (docs/nirt_model.md, 2026-09-04):
  # RouterBench's 0-/5-shot items share identical text (-> identical e_q) with
  # different labels; a single shot-indicator feature recovered most of the gap
  # (val BCE 0.602 -> 0.569) -- the "default" variant includes it.
  query_features: null      # e.g. "default"
  score_kind: effective      # target column in nirt_observations (effective = chance-corrected where MC)
  metrics: null              # null = all correctness metrics present in nirt_observations.parquet

model:
  orientation: query_latent  # {query_latent (ours: theta_q = f(e_q), a_m/b_m on model),
                             #  model_latent (IRT-Router: theta_m from e_m, a_q/b_q on query)}
  dim: 1                     # K, number of latent ability dimensions (1 -> classical-IRT-comparable)
  model_params: projected    # {projected, free}
                             #   projected: model-side params = linear heads on e_m (cold-start capable)
                             #   free:      model-side params = per-model free parameters (transductive)
  query_hidden: 64           # hidden width of the query head(s); null -> a single linear layer
  difficulty: scalar         # query_latent only. {scalar: logit = a.theta - b (b in R^1);
                             #  vector: logit = sum_k a_k (theta_k - b_k), b in R^K (per-dim threshold)}
  # -- query-head capacity (P2a). Defaults reproduce the legacy
  #    Linear->ReLU->Linear head bit-for-bit; existing checkpoints load unchanged.
  query_head_layers: 1       # number of hidden Linear->act blocks (1 = the legacy head)
  query_head_norm: none      # {none, layernorm} -- LayerNorm after each hidden Linear
  query_head_activation: relu  # {relu, gelu}
  query_head_dropout: 0.0    # dropout after each hidden activation (NIRT's first regulariser)
  query_head_residual: false # residual connections between equal-width hidden blocks (layers >= 2)
  model_hidden: null         # P2b, projected mode only: a_m/b_m via a 1-hidden-layer MLP on e_m
                             #   instead of a bare linear projection. null -> legacy linear heads.
  # -- non-additive interaction residual (P2c, query_latent only). off -> strictly
  #    bilinear logit, byte-identical state_dict. on -> logit += gamma * MLP([theta_q, a_m, theta_q*a_m])
  #    with gamma init 0 (no-op at start).
  interaction: false
  interaction_hidden: 32
  constrain_discrimination: auto   # auto -> true iff dim == 1 (softplus keeps discrimination > 0, like 2PL)
  bound_ability: true        # model_latent only: theta_m = sigmoid(W_theta e_m), as in the paper
  # -- P7b, query_latent only: fixes for the monotone-collapse diagnosis
  #    (theta_q collapses toward a 1-D line -> single-crossing, family-blind
  #    routing). Both off by default, byte-identical state_dict when off.
  center_discrimination: false   # a_m <- a_m - mean_m(a_m) each forward pass. Exactly
                                  #   lossless for within-query ranking (the removed term
                                  #   cancels in every pairwise/argmax comparison); removes
                                  #   the dominant shared-direction pull on theta_q's gradient.
  query_head_batchnorm: false     # BatchNorm1d(affine=false) on theta_q -- forces
                                  #   Cov(theta_q) ~= I_K, i.e. effective rank == K.

train:
  loss: soft_bce             # {soft_bce, mse, hard_bce}  (per-cell)
                             # P5 routing-aware (force sampler=query): {pairwise (RankNet/BT on
                             # model pairs within a query), listwise (ListNet top-1),
                             # bce_pairwise (soft_bce + loss_aux_weight * pairwise)}
  sampler: cell              # {cell (per-observation shuffle, legacy), query (whole query
                             #  groups per batch -- required by the routing-aware losses)}
  batch_queries: 512         # queries per batch when sampler=query
  loss_aux_weight: 0.5       # weight on the pairwise term in loss=bce_pairwise
  listwise_tau: 0.1          # softmax temperature on the graded label for loss=listwise
  # -- P7c: loss refinements on top of loss=pairwise/bce_pairwise. Both no-ops
  #    at their defaults (weighting=none reproduces the unweighted mean exactly;
  #    weight=1.0 reproduces the unweighted per-cell loss exactly).
  pairwise_weighting: none   # {none, abs_diff} -- abs_diff weights each discordant pair's
                             #   loss by |y_m - y_n| instead of counting every pair equally;
                             #   most routing regret concentrates in the most extreme pairs.
  zero_variance_weight: 1.0  # multiplier on the per-cell loss for queries where every
                             #   scored model shares one label (no ranking information,
                             #   but a full per-cell BCE loss still spends a batch slot on it).
  # -- P7b: additive covariance penalty, complementary to model.query_head_batchnorm.
  theta_cov_weight: 0.0      # VICReg-style off-diagonal Cov(theta_q) penalty weight (0 -> off)
  lr: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 4096
  epochs: 50
  patience: 6                # early-stop after this many epochs without val improvement
  val_metric: bce            # {bce, mse, regret} -- lower is better (regret = mean per-query
                             #   routing regret; use it with the P5 routing-aware losses)
  grad_clip: 0.0             # max grad-norm (0 -> off); a deeper query head can spike
  lr_schedule: none          # {none, cosine, plateau} -- constant LR by default
  materialize: true          # gather the split into RAM once (fast on CPU; ~1.6 GB for train).
                             # false -> stream via NIRTDataset.dataloader()
  # -- P7d: per-epoch monotone-collapse alarm (query_latent only). Diagnostics
  #    (theta_effective_rank, and for model_params=free + difficulty=scalar also
  #    bias_argmax_agreement) are ALWAYS logged into run.json history -- cheap,
  #    informational only. abort_on_collapse additionally stops training early
  #    when collapse is sustained; off by default (warns only).
  abort_on_collapse: false
  collapse_rank_threshold: 1.3       # theta_effective_rank below this counts as collapsed
  collapse_agreement_threshold: 0.95 # bias_argmax_agreement above this counts as collapsed
  collapse_patience: 3               # consecutive collapsed epochs before aborting
  # Item 2 of the capacity workstream (docs/nirt_model.md): an auxiliary
  # Bradley-Terry loss over Chatbot Arena / GPT-4-Judge battles
  # (training.nirt.pairwise), on the SAME shared query head -- separate signal,
  # never folded into the correctness matrix R[q,m]. Needs model.model_params:
  # projected (a 'free' model has no row for battle participants outside the
  # correctness pool). Off by default.
  preference:
    enabled: false
    source: null             # null -> every pairwise source; or "chatbot_arena" / "gpt4_judge"
    weight: 0.3               # aux-loss weight added to the correctness loss
    batch_size: 4096
    query_pathway: null       # query store for the BATTLES (independent of data.query_pathway --
                              #   Arena/Judge reference a different query set entirely, e.g. an
                              #   "irt_arena_sample" store); null -> data.pathway

# Classical-IRT baseline (scripts/nirt/compare.py). Free per-query theta_q, no text.
classical_irt:
  dim: null                  # null -> match the NIRT run being compared
  holdout_frac: 0.15         # random (query, model) cells held out for the prediction ceiling
  epochs: 500
  lr: 0.05
  weight_decay: 1.0e-3       # regularises theta_q; without it the factorisation overfits

# kNN-imputed query representation sweep (scripts/nirt/knn_impute_sweep.py).
# Each query's e_q is replaced by the similarity-weighted mean of its k nearest
# TRAIN queries (self-excluded) before the query head sees it. See
# docs/nirt_model.md (kNN-imputed queries).
knn_impute:
  k_values: [1, 5, 10, 25]
  weighting: similarity      # {similarity (cosine-weighted), uniform}
  dim: 2                     # latent K for the swept runs (matches nirt-2d-projected)
  retrieval_pathway: retrieval
  target_pathway: irt
  ood: true                  # also build a leakage-safe OOD bank + evaluate held-out families
  reference_runs: [nirt-2d-projected, irt-25d-projected]   # existing models to table alongside

routing:
  reference_model: gpt-4-1106-preview   # strong fixed model that cost savings are quoted against
  lambda_sweep: [0.0, 0.05, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0]
  reward_alphas: [0.5, 0.7, 0.8, 0.9]   # IRT-Router Reward = a*quality - (1-a)*linear(cost)

evaluation:
  # Held out of training entirely; the OOD test set is exactly these families
  # (see docs/routing_evaluation.md). Family map = configs/phase0.yaml profiles.task_families.
  ood_holdout_families: [math, code]

baselines:
  knn_router:  {k: 5, pathway: retrieval}   # RouterBench-style kNN over MiniLM query embeddings
  mlp_router:  {hidden: 128, epochs: 40, lr: 1.0e-3, pathway: irt}   # IRT-free ablation

runs_dir: data/processed/nirt_runs   # checkpoints + run.json land here (gitignored)
