# Canonical model registry (human-reviewed).
#
# Purpose: map every source-native model string to a stable `canonical_id`
# WITHOUT conflating distinct checkpoints. The AMIRT model must never think
# `gpt-4-0314`, `gpt-4-0613`, `gpt-4-1106-preview` are one model.
#
# Merge policy
# ------------
#   confidence: high    -> alias is merged to canonical_id at load time
#   confidence: medium  -> recorded, NOT merged (canonical_id = slugified native)
#   confidence: low     -> recorded, NOT merged
#
# Only same-checkpoint identity mappings and unambiguous provider-prefix
# rewrites are marked `high`. Cross-source merges (e.g. RouterBench `claude-v2`
# vs Arena `claude-2.0` / `claude-2.1`) are deliberately absent -- they need
# human confirmation and are tracked in docs/model_registry.md.
#
# `family` / `version` are informational (grouping, profile text). `null` =
# not yet reviewed.

version: 1
default_confidence_to_merge: high

models:
  # ---- RouterBench (11) -- native strings are exact provider labels ----
  - canonical_id: gpt-4-1106-preview
    provider: openai
    family: gpt-4
    version: "1106-preview"
    aliases:
      - { native: "gpt-4-1106-preview", confidence: high }

  - canonical_id: gpt-3.5-turbo-1106
    provider: openai
    family: gpt-3.5-turbo
    version: "1106"
    aliases:
      - { native: "gpt-3.5-turbo-1106", confidence: high }

  - canonical_id: claude-v1
    provider: anthropic
    family: claude
    version: "v1"
    notes: "RouterBench label. Arena's `claude-1` is likely the same era but is kept separate (unconfirmed)."
    aliases:
      - { native: "claude-v1", confidence: high }

  - canonical_id: claude-v2
    provider: anthropic
    family: claude
    version: "v2 (2.0 or 2.1 unspecified by RouterBench)"
    notes: "RouterBench label is ambiguous between 2.0 and 2.1; NOT merged with Arena's `claude-2.0` / `claude-2.1`."
    aliases:
      - { native: "claude-v2", confidence: high }

  - canonical_id: claude-instant-v1
    provider: anthropic
    family: claude-instant
    version: "v1"
    aliases:
      - { native: "claude-instant-v1", confidence: high }

  - canonical_id: llama-2-70b-chat
    provider: meta
    family: llama-2
    version: "70b-chat"
    aliases:
      - { native: "meta/llama-2-70b-chat", confidence: high }
      - { native: "llama-2-70b-chat", confidence: high }

  - canonical_id: code-llama-34b-instruct
    provider: meta
    family: code-llama
    version: "34b-instruct"
    notes: "Arena's `codellama-34b-instruct` is very likely the same checkpoint but kept separate pending review."
    aliases:
      - { native: "meta/code-llama-instruct-34b-chat", confidence: high }

  - canonical_id: mixtral-8x7b-instruct
    provider: mistralai
    family: mixtral
    version: "8x7b-instruct-v0.1"
    notes: "Only one Mixtral-8x7B-Instruct checkpoint ever existed (v0.1), so RouterBench's `mixtral-8x7b-chat`, Arena's and the GPT-4-Judge's `mixtral-8x7b-instruct-v0.1` are merged."
    aliases:
      - { native: "mistralai/mixtral-8x7b-chat", confidence: high }
      - { native: "mixtral-8x7b-instruct-v0.1", confidence: high }

  - canonical_id: mistral-7b-instruct
    provider: mistralai
    family: mistral-7b
    version: "instruct (RouterBench label; checkpoint unspecified)"
    notes: "NOT merged with Arena's `mistral-7b-instruct-v0.1` / `-v0.2` (RouterBench does not say which)."
    aliases:
      - { native: "mistralai/mistral-7b-chat", confidence: high }

  - canonical_id: wizardlm-13b-v1.2
    provider: microsoft
    family: wizardlm
    version: "13b-v1.2"
    notes: "Arena's `wizardlm-13b` kept separate (version unconfirmed)."
    aliases:
      - { native: "WizardLM/WizardLM-13B-V1.2", confidence: high }

  - canonical_id: yi-34b-chat
    provider: 01-ai
    family: yi
    version: "34b-chat"
    aliases:
      - { native: "zero-one-ai/Yi-34B-Chat", confidence: high }

