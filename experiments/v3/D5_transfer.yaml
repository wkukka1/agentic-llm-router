name: D5_transfer
notes: >
  Two-stage. Starts from D2 (trained on 16k mixed benchmark + real rows) and
  fine-tunes on hand-labelled real prompts only. Benchmarks supply domain
  vocabulary at scale; the real prompts correct the distribution.

  This is the production configuration. Neither stage alone works: the mixed
  model alone reaches 58.9% on real prompts and real-only training 54.8%,
  while the two stages together reach 67.4%. Epochs and learning rate were
  swept (66.3-67.4% across the grid), so the remaining headroom is training
  data, not tuning.
model:
  name: finetune_transformer
  params:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    init_from: artifacts/v3/D2_minilm/model
    max_length: 256
    batch_size: 16
    epochs: 12
    lr: 0.00004
    class_weighted_loss: false
data: {variant: real_only, label_column: domain}
