name: D2_minilm
notes: >
  MiniLM fine-tune on the mixed corpus. Class weighting is off: an earlier
  sweep showed it trades precision for recall on rare classes and cost 4 points
  of real-prompt accuracy.
model:
  name: finetune_transformer
  params:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    max_length: 256
    batch_size: 32
    epochs: 4
    lr: 0.00003
    class_weighted_loss: false
data: {variant: domain_v3, label_column: domain}
