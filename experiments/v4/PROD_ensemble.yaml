name: PROD_ensemble
notes: >
  Production configuration: six frozen encoders with light heads, averaged.

  Frozen encoders rather than fine-tuning, because fine-tuning on ~2k real
  examples is high-variance -- five seeds of one config spanned 63.5-67.8%
  (sd 1.75), wider than most effects worth measuring. These members are
  deterministic and individually stronger.

  Members selected on validation, never on test. An earlier search scored
  against test read 76.0% where the honest protocol gives 74.75%.

  `intfloat/*` models receive the "query: " prefix their training used; this is
  applied automatically by EmbeddingEncoder. Omitting it cost e5-large 3.25
  points (0.6675 -> 0.7000), which was a real bug rather than a tuning choice.
model:
  name: ensemble
  params:
    members:
      - name: embed_logreg
        params: {encoder_model: intfloat/multilingual-e5-large-instruct, pooling: mean, max_length: 256, C: 4.0, class_weight: null}
      - name: embed_logreg
        params: {encoder_model: BAAI/bge-base-en-v1.5, pooling: cls, max_length: 256, C: 4.0, class_weight: null}
      - name: embed_logreg
        params: {encoder_model: BAAI/bge-large-en-v1.5, pooling: cls, max_length: 256, C: 4.0, class_weight: null}
      - name: embed_logreg
        params: {encoder_model: BAAI/bge-m3, pooling: cls, max_length: 256, C: 4.0, class_weight: null}
      - name: embed_logreg
        params: {encoder_model: mixedbread-ai/mxbai-embed-large-v1, pooling: cls, max_length: 256, C: 4.0, class_weight: null}
      - name: knn_embed
        params: {encoder_model: BAAI/bge-large-en-v1.5, pooling: cls, max_length: 256, k: 25, temperature: 0.04}
data: {variant: real_only, label_column: domain}
