name: P1w_tfidf_logreg_wide
notes: >
  Wide-gap variant (min_tier_gap 0.15): fewer rows, crisper label.
  Lexical baseline on the direct routing label. If surface words alone predict
  "does this need the strong model", the whole domain-taxonomy detour is
  unnecessary and this is the answer to priority 0.
model:
  name: tfidf_logreg
  params:
    word_ngrams: [1, 2]
    char_ngrams: [3, 5]
    min_df: 3
    C: 2.0
data:
  variant: preference_wide
  label_column: routing_label
