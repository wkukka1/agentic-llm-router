name: P3_finetune_minilm
notes: >
  Same architecture that won the domain sweep, pointed at the routing label.
  The head-to-head that answers priority 0: does predicting the decision
  directly beat predicting a topic and inferring the decision from it?
model:
  name: finetune_transformer
  params:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    max_length: 256
    batch_size: 32
    epochs: 3
    lr: 0.00003
data:
  variant: preference
  label_column: routing_label
