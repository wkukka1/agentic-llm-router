name: 00b_zeroshot_minilm
notes: >
  Same zero-shot setup on MiniLM, to separate "zero-shot is weak" from
  "this particular encoder is weak".
model:
  name: zeroshot_similarity
  params:
    encoder_model: sentence-transformers/all-MiniLM-L6-v2
    pooling: mean
    max_length: 256
    temperature: 0.05
data:
  variant: full_prompt
