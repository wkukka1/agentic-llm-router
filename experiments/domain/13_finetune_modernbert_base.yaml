name: 13_finetune_modernbert_base
notes: >
  ModernBERT-base (149M). Newer pretraining and an 8192 context; the interesting
  question is whether recent pretraining beats DeBERTa's architecture on a
  small, single-source training set.
model:
  name: finetune_transformer
  params:
    model_name: answerdotai/ModernBERT-base
    max_length: 512
    batch_size: 16
    epochs: 4
    lr: 0.00002
data:
  variant: full_prompt
