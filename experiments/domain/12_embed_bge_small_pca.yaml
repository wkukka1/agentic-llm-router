name: 12_embed_bge_small_pca
notes: >
  PCA without standardising first. Experiments 14-18 all lose ~7 points
  regardless of how much variance or how many features they keep, which points
  at the one step they share: StandardScaler. The encoder emits L2-normalised
  vectors, so rescaling each dimension to unit variance destroys the geometry
  the embedding space was trained to have. This isolates that.
model:
  name: embed_reduced_logreg
  params:
    encoder_model: BAAI/bge-small-en-v1.5
    pooling: cls
    max_length: 256
    order: pca_only
    n_components: 0.95
    standardize: false
    C: 8.0
data:
  variant: full_prompt
