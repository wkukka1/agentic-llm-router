name: 02_tfidf_logreg_wordchar
notes: >
  Adds char_wb 3-5 grams. Tests whether sub-word signal (code identifiers,
  LaTeX, non-English fragments) recovers the domains word tokenisation shreds.
model:
  name: tfidf_logreg
  params:
    word_ngrams: [1, 2]
    char_ngrams: [3, 5]
    min_df: 2
    C: 4.0
data:
  variant: full_prompt
