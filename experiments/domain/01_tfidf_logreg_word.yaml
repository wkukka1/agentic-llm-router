name: 01_tfidf_logreg_word
notes: >
  Cheapest possible router head. Word n-grams only. Establishes the latency and
  accuracy floor every heavier model has to beat.
model:
  name: tfidf_logreg
  params:
    word_ngrams: [1, 2]
    char_ngrams: null
    min_df: 2
    C: 4.0
data:
  variant: full_prompt
