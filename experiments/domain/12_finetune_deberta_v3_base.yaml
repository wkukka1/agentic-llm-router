name: 12_finetune_deberta_v3_base
notes: >
  DeBERTa-v3-base (184M). Usually the strongest encoder at this size for
  classification; disentangled attention tends to help when the signal is
  topical rather than lexical. Expected ceiling of the sweep.
model:
  name: finetune_transformer
  params:
    model_name: microsoft/deberta-v3-base
    max_length: 512
    batch_size: 16
    epochs: 4
    lr: 0.00002
data:
  variant: full_prompt
