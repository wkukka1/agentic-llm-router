name: 03_tfidf_svm_wordchar
notes: >
  Max-margin variant of experiment 02, Platt-calibrated so the router still gets
  usable probabilities. Isolates loss function from feature representation.
model:
  name: tfidf_linear_svm
  params:
    word_ngrams: [1, 2]
    char_ngrams: [3, 5]
    min_df: 2
    C: 1.0
data:
  variant: full_prompt
