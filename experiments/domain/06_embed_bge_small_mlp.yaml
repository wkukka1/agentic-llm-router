name: 06_embed_bge_small_mlp
notes: >
  Same frozen encoder as 05 with a non-linear head. If this beats 05 by much,
  domain structure is not linearly separable in the frozen space and fine-tuning
  should pay off.
model:
  name: embed_mlp
  params:
    encoder_model: BAAI/bge-small-en-v1.5
    pooling: cls
    max_length: 256
    hidden_sizes: [384]
    alpha: 0.0001
data:
  variant: full_prompt
