name: 00_zeroshot_bge_small
notes: >
  No training at all. Embed a description of each of the 9 domains, embed the
  prompt, pick the nearest label by cosine similarity. This is the honest floor
  for what the base encoder already knows, and the only approach in the sweep
  that cannot overfit the benchmark formatting, because it never sees the
  training set.
model:
  name: zeroshot_similarity
  params:
    encoder_model: BAAI/bge-small-en-v1.5
    pooling: cls
    max_length: 256
    temperature: 0.05
data:
  variant: full_prompt
