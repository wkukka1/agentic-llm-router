name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is in the matrix deliberately: file encoding and path handling
    # are the two things that silently break there, and only CI catches it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./aar-gateway -e ".[research,dev]"
          pip install pytest ruff pytest-github-actions-annotate-failures

      - name: Lint
        run: ruff check src tests

      - name: Test
        # Offline by design: no API keys, no dataset downloads. Tests that need
        # a trained artifact skip themselves.
        run: pytest -q

  gateway:
    # What a user installs: the aar-gateway package alone -- no torch, none of the
    # research stack. Its tests must pass on every OS people run Claude Code on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (gateway only)
        run: |
          python -m pip install --upgrade pip
          pip install "./aar-gateway[dev]" pytest-github-actions-annotate-failures

      - name: Test
        run: pytest -q -p no:cacheprovider aar-gateway/tests
