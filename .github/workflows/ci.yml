name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        # The suite is offline by design: no API keys, no dataset downloads.
        # Tests that need a trained artifact skip themselves.
        run: pytest -q
