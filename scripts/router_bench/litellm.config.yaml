# LiteLLM proxy for the router bake-off. Every Claude deployment points at the recorder stub
# ({UPSTREAM}); embeddings for the auto-router come from local Ollama. Three routers share it,
# chosen by the request's model name:
#   complexity-router -- LiteLLM's native rule-based complexity router, tier map fixed up front
#   semantic-router   -- LiteLLM's auto-router with our tier utterances (litellm.auto_router.json)
#   claude-*-5-5      -- plain alias passthrough (the control)
model_list:
  - model_name: claude-haiku-5-5
    litellm_params: {model: anthropic/claude-haiku-5-5, api_base: "{UPSTREAM}", api_key: aar-bench-dummy}
  - model_name: claude-sonnet-5-5
    litellm_params: {model: anthropic/claude-sonnet-5-5, api_base: "{UPSTREAM}", api_key: aar-bench-dummy}
  - model_name: claude-opus-5-5
    litellm_params: {model: anthropic/claude-opus-5-5, api_base: "{UPSTREAM}", api_key: aar-bench-dummy}
  - model_name: nomic-embed
    litellm_params: {model: ollama/nomic-embed-text, api_base: "http://127.0.0.1:11434"}
  - model_name: complexity-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: claude-haiku-5-5
          MEDIUM: claude-sonnet-5-5
          COMPLEX: claude-sonnet-5-5
          REASONING: claude-opus-5-5
  - model_name: semantic-router
    litellm_params:
      model: auto_router/semantic-router
      auto_router_config_path: "{AUTO_ROUTER_JSON}"
      auto_router_default_model: claude-sonnet-5-5
      auto_router_embedding_model: nomic-embed
litellm_settings:
  telemetry: false
  drop_params: true
  turn_off_message_logging: true
  num_retries: 0
general_settings:
  disable_spend_logs: true
