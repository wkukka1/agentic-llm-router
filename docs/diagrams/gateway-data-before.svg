    <tspan x="1495" dy="20">(only if capture_prompts,</tspan>
    <tspan x="1495" dy="20">off by default)</tspan>
  </text>
  <text x="1495" y="770" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="1495" dy="0">share queue</tspan>
    <tspan x="1495" dy="20">(newest 20,000 only;</tspan>
    <tspan x="1495" dy="20">busy worker drops)</tspan>
  </text>
  <text x="2235" y="1030" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
