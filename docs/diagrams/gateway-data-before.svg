    <tspan x="2235" dy="20">(overwritten at</tspan>
    <tspan x="2235" dy="20">the next rotation)</tspan>
  </text>
  <text x="1495" y="528" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
