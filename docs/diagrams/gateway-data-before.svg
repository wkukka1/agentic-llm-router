    <tspan x="1495" dy="20">openai-lane model</tspan>
  </text>
  <text x="1495" y="308" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="1495" dy="0">requests.jsonl</tspan>
    <tspan x="1495" dy="20">(50 MB limit)</tspan>
  </text>
  <text x="2235" y="177" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
