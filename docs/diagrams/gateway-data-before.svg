  </text>
  <text x="1137.5" y="484" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="1137.5" dy="0">one record per call</tspan>
    <tspan x="1137.5" dy="17.5">(no prompt text)</tspan>
  </text>
  <text x="1855" y="256.75" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="1855" dy="0">rotate</tspan>
  </text>
  <text x="1110" y="607.75" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="1110" dy="0">opt-in config</tspan>
  </text>
  <text x="1122.5" y="720" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="1122.5" dy="0">opt-in: anonymous</tspan>
    <tspan x="1122.5" dy="17.5">features</tspan>
  </text>
  <text x="1877.5" y="905.5" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
