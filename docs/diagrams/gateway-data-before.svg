    <tspan x="2235" dy="20">private dataset</tspan>
  </text>
  <text x="2235" y="524" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="2235" dy="0">/stats dashboard</tspan>
    <tspan x="2235" dy="20">(loads every record</tspan>
    <tspan x="2235" dy="20">into memory)</tspan>
  </text>
  <text x="460" y="668.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
