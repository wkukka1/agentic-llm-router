    <tspan x="785" dy="20">(interceptor)</tspan>
  </text>
  <text x="1495" y="1030" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
