  <text x="330" y="90" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="330" dy="0">Sub-task prompt</tspan>
    <tspan x="330" dy="20">(from _solve)</tspan>
  </text>
  <text x="330" y="278" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="330" dy="0">Decompose</tspan>
    <tspan x="330" dy="20">-&gt; sub-prompts</tspan>
  </text>
  <text x="330" y="466" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="330" dy="0">Route batch</tspan>
    <tspan x="330" dy="20">(one router call)</tspan>
  </text>
  <text x="330" y="654" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="330" dy="0">Plan</tspan>
    <tspan x="330" dy="20">steps + alternatives</tspan>
  </text>
  <text x="330" y="842" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="330" dy="0">RouterPlanForecaster</tspan>
    <tspan x="330" dy="20">cost / quality / latency</tspan>
  </text>
  <text x="330" y="1030" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="330" dy="0">BudgetLedger</tspan>
    <tspan x="330" dy="20">resize(estimate)</tspan>
  </text>
  <text x="190" y="1218" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="190" dy="0">over_budget</tspan>
    <tspan x="190" dy="20">(error SubCall)</tspan>
  </text>
  <text x="470" y="1218" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="470" dy="0">Execute by level</tspan>
    <tspan x="470" dy="20">(parallel ThreadPool)</tspan>
  </text>
  <text x="145" y="1418" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="145" dy="0">agent._call_model</tspan>
    <tspan x="145" dy="20">(per step)</tspan>
  </text>
  <text x="470" y="1408" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="470" dy="0">Replan</tspan>
    <tspan x="470" dy="20">failed step -&gt; next-best model</tspan>
    <tspan x="470" dy="20">(re-score, reserve, retry)</tspan>
  </text>
  <text x="770" y="1428" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="770" dy="0">Synthesize</tspan>
  </text>
  <text x="770" y="1618" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="770" dy="0">answer + SubCalls</tspan>
    <tspan x="770" dy="20">(commit actual cost)</tspan>
  </text>
  <text x="330" y="757.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="330" dy="0">score</tspan>
  </text>
  <text x="330" y="945.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="330" dy="0">reserve</tspan>
  </text>
  <text x="260" y="1133.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="260" dy="0">doesn't fit</tspan>
  </text>
  <text x="400" y="1133.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="400" dy="0">fits</tspan>
  </text>
  <text x="307.5" y="1327.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="307.5" dy="0">independent steps</tspan>
  </text>
  <text x="470" y="1312.5" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="470" dy="0">step failed</tspan>
    <tspan x="470" dy="17.5">(&lt;= max_replans)</tspan>
  </text>
  <text x="620" y="1333.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="620" dy="0">all ok</tspan>
  </text>
